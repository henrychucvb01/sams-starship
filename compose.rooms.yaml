services:
  rooms:
    build:
      context: .
      dockerfile: Dockerfile.rooms
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      STARSHIP_ORIGIN: ${STARSHIP_ORIGIN:?Set the exact HTTPS frontend origin}
    volumes:
      - rooms-data:/data
volumes:
  rooms-data:
